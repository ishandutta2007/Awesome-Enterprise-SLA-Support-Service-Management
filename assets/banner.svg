<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Accent Flow Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Orb Gradients -->
    <radialGradient id="cyanOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.5" fill="#64748b" fill-opacity="0.3" />
    </pattern>

    <style>
      .pulse-orb {
        animation: floatOrb 8s ease-in-out infinite alternate;
      }
      .pulse-orb-2 {
        animation: floatOrb2 10s ease-in-out infinite alternate;
      }
      .flow-line {
        stroke-dasharray: 8 6;
        animation: dash 20s linear infinite;
      }
      .badge-pulse {
        animation: badgePulse 3s ease-in-out infinite;
      }
      .status-dot {
        animation: statusBlink 2s ease-in-out infinite;
      }
      @keyframes floatOrb {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(50px, 20px) scale(1.15); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-40px, -25px) scale(1.1); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes badgePulse {
        0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 2px rgba(56,189,248,0.3)); }
        50% { opacity: 1; filter: drop-shadow(0 0 10px rgba(56,189,248,0.7)); }
      }
      @keyframes statusBlink {
        0%, 100% { opacity: 0.6; r: 4; }
        50% { opacity: 1; r: 5.5; }
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Subtle Tech Grid -->
  <rect width="1200" height="420" fill="url(#techGrid)" />

  <!-- Background Dynamic Orbs (Behind content) -->
  <circle cx="150" cy="80" r="240" fill="url(#cyanOrb)" class="pulse-orb" />
  <circle cx="1060" cy="340" r="260" fill="url(#purpleOrb)" class="pulse-orb-2" />

  <!-- Animated Service Flow Circuit in Lower Background -->
  <g opacity="0.45" class="flow-line">
    <path d="M -50,330 Q 300,370 600,320 T 1250,340" fill="none" stroke="url(#primaryGrad)" stroke-width="2" />
    <path d="M -50,345 Q 350,290 700,350 T 1250,310" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.6" />
  </g>

  <!-- Foreground Main Content Container -->
  <!-- Header Category Pill -->
  <g transform="translate(600, 52)">
    <rect x="-180" y="-16" width="360" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" class="badge-pulse" />
    <circle cx="-155" cy="0" r="4.5" fill="#10b981" class="status-dot" />
    <text x="-142" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1.5">ENTERPRISE ITIL &amp; SERVICE OPS</text>
    <rect x="95" y="-10" width="65" height="20" rx="10" fill="#0369a1" />
    <text x="127" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#e0f2fe" text-anchor="middle">SLA 99.9%</text>
  </g>

  <!-- Main Title (Clean, crisp, clear foreground) -->
  <text x="600" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.8">
    Enterprise SLA &amp; Service Management
  </text>
  
  <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="url(#primaryGrad)" letter-spacing="0.2">
    ITIL Service Delivery • Incident &amp; Request Tracking • Open-Source &amp; Cloud ITSM
  </text>

  <text x="600" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8">
    Curated benchmarks for IT Operations, SLA Governance, CMDB Assets, and Self-Hosted Support Desks
  </text>

  <!-- Dynamic Feature Metric Cards (Foreground Floating Row) -->
  <g transform="translate(100, 235)">
    <!-- Card 1: ITIL Core -->
    <g transform="translate(0, 0)" filter="url(#cardShadow)">
      <rect width="230" height="135" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="0.8" />
      <text x="34" y="40" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#38bdf8">⚡</text>
      <text x="62" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">ITIL Practices</text>
      <text x="62" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Incident &amp; Change</text>
      <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#cbd5e1">Standardized ITIL workflows, problem triage, and change advisory boards.</text>
      <path d="M 16,114 L 214,114" stroke="#334155" stroke-width="1" />
      <text x="16" y="127" font-family="monospace" font-size="10" fill="#38bdf8">● MTTR Reduction</text>
    </g>

    <!-- Card 2: SLA Management -->
    <g transform="translate(255, 0)" filter="url(#cardShadow)">
      <rect width="230" height="135" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="0.8" />
      <text x="34" y="40" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#818cf8">⏱️</text>
      <text x="62" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">SLA Governance</text>
      <text x="62" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Breach Warning &amp; Escalation</text>
      <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#cbd5e1">Multi-tier response &amp; resolution targets, business hour calendars, and alerts.</text>
      <path d="M 16,114 L 214,114" stroke="#334155" stroke-width="1" />
      <text x="16" y="127" font-family="monospace" font-size="10" fill="#818cf8">● Zero-Breach Engine</text>
    </g>

    <!-- Card 3: CMDB & Asset Discovery -->
    <g transform="translate(510, 0)" filter="url(#cardShadow)">
      <rect width="230" height="135" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#6b21a8" fill-opacity="0.3" stroke="#c084fc" stroke-width="0.8" />
      <text x="34" y="40" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#c084fc">🖥️</text>
      <text x="62" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">CMDB &amp; Assets</text>
      <text x="62" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Auto-Discovery &amp; Topology</text>
      <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#cbd5e1">Hardware, software licenses, CI dependency mappings, and audit histories.</text>
      <path d="M 16,114 L 214,114" stroke="#334155" stroke-width="1" />
      <text x="16" y="127" font-family="monospace" font-size="10" fill="#c084fc">● CI Dependency Map</text>
    </g>

    <!-- Card 4: Open-Source Freedom -->
    <g transform="translate(765, 0)" filter="url(#cardShadow)">
      <rect width="235" height="135" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#065f46" fill-opacity="0.3" stroke="#34d399" stroke-width="0.8" />
      <text x="34" y="40" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#34d399">🔓</text>
      <text x="62" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Self-Hosted / OSS</text>
      <text x="62" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">No Per-Seat Lock-in</text>
      <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#cbd5e1">Full data sovereignty, compliance audit trails, and zero agent licensing limits.</text>
      <path d="M 16,114 L 219,114" stroke="#334155" stroke-width="1" />
      <text x="16" y="127" font-family="monospace" font-size="10" fill="#34d399">● 100% Data Sovereignty</text>
    </g>
  </g>
</svg>